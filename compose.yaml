name: itlive23bot

services:
  app:
    build: .
    image: itlive23bot:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/itlive.sqlite3
      PORT: "8080"
      BIND_HOST: 0.0.0.0
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
